<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockups · Started games</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding-bottom: 60px; }
  .mock { max-width: 560px; margin: 0 auto; padding: 0 10px; }
  .mock-h { margin: 30px 4px 4px; font-size: 13px; font-weight: 800; color: var(--text); }
  .mock-sub { margin: 0 4px 6px; font-size: 12px; color: var(--muted); }
  .note { margin: 18px 4px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent); }

  /* ---- Spacing: 12px under a band and under a date; ~28px above a date only when a
     game card is right above it; the same 20px above and below a band. ---- */
  .mock .day-title { margin: 8px 4px 8px; }
  .mock .game + .day-title { margin-top: 14px; }
  .band { margin: 20px -10px 16px; padding: 9px 14px; background: #141b33; border-top: 1px solid #2d3963; border-bottom: 1px solid #2d3963;
    display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--text); }
  .band small { font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
  .band.live span { color: #ff8f9b; display: inline-flex; align-items: center; gap: 6px; }
  .band.live span::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff5a6e; animation: blink 1.4s ease-in-out infinite; }
  .band + .day-title { margin-top: 16px; } /* 20px to the capitals, same as above the band */

  /* ---- Live and final cards: same card, same grid ---- */
  .game.live { border-color: rgba(255, 107, 125, 0.4); }
  .game.final { background: #10162b; }
  .game.final .g-grid { grid-template-rows: auto auto 24px auto; } /* same height as the others */
  .live-clock { color: #ff8f9b; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .live-clock::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff5a6e; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* Scored team: abbr small under the logo (where the record sits); the score where the
     abbr was, the ball beside it while they have it, timeouts left under it. */
  .g-team.scored .g-abbr-s { grid-column: 1; grid-row: 2; justify-self: center; font-size: 9.5px; font-weight: 700; color: var(--muted); line-height: 1; }
  .g-team.scored .score-line { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 7px; }
  .g-team.scored .ball { font-size: 12px; line-height: 1; }
  .g-team.scored .g-score { font-size: 21px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text); }
  .g-team.scored .tos { grid-column: 2; grid-row: 2; display: flex; gap: 3px; padding-left: 3px; }
  .tos i { width: 5px; height: 5px; border-radius: 50%; background: #c9d1ea; }
  .tos i.used { background: #2b3557; }
  /* Final: abbr under the logo, the score beside both, about as tall as the logo. */
  /* What decided the spread and total, in the row between the teams. */
  .settle { display: grid; place-items: center; height: 24px; font-size: 12px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .settle .num { position: relative; } .settle .sg { position: absolute; right: 100%; }
  .momentum { display: block; width: 100%; height: 20px; align-self: center; }
  .g-team.lost { opacity: 0.45; }

  /* Where the ball is, in the row between the teams: the arrow points at the team with it. */
  .drive { display: flex; align-items: center; gap: 5px; height: 24px; min-width: 0; padding-left: 3px;
    font-size: 11.5px; font-weight: 700; color: #b9c2dd; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .drive .last { flex: 1; min-width: 0; overflow: hidden; font-weight: 500; color: var(--muted);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8px, #000 85%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8px, #000 85%, transparent); }
  .drive .last span { display: inline-block; padding-left: 100%; animation: ticker 16s linear infinite; }
  @keyframes ticker { to { transform: translateX(-100%); } }
  .drive .sep { width: 1px; height: 12px; background: #2d3963; }
  .drive .arrow { font-size: 9px; color: var(--text); }
  .drive.redzone { color: #ff8f9b; }
  .drive.redzone .arrow { color: #ff8f9b; }

  .cell.frozen { cursor: default; }
  .cell.frozen:active { transform: none; }
  .cell.won { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell.won::after {
    content: '✓'; position: absolute; top: -6px; right: -5px; width: 16px; height: 16px; border-radius: 50%;
    display: grid; place-items: center; font-size: 10px; font-weight: 900; color: var(--accent-ink); background: var(--accent);
  }
  .cell.lost { opacity: 0.38; }

  /* No kickoff prices: what happened, in two tiles instead of six boxes. */
  .result-tile { display: grid; place-content: center; text-align: center; gap: 4px; border: 1px solid var(--line); border-radius: 9px; background: #0e1428; }
  .result-tile small { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--muted); }
  .result-tile b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  .result-tile em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--muted); }

  /* ---- Dial ticks under the line strip: small, centered between the cells ---- */
  .dial .strip-item { position: relative; place-items: start center; padding-top: 3px; line-height: 13px; }
  .dial .strip-item::after { content: ''; position: absolute; left: 50%; bottom: 3px; width: 1.5px; height: 3px; margin-left: -0.75px; border-radius: 1px; background: #4a5683; }
  .dial .strip-item.on::after { height: 4px; background: var(--accent); }
  .strip-item .num { position: relative; }
  .strip-item .sg { position: absolute; right: 100%; }
</style>
</head>
<body>
<main class="mock" id="mock"></main>
<script type="module">
const logo = (t, s = 24) => `<img class="logo" style="width:${s}px;height:${s}px" src="https://sleepercdn.com/images/team_logos/nfl/${t.toLowerCase()}.png" alt="${t}">`;
const face = (src, rot = -9) => `<span class="sticker" style="--rot:${rot}deg;--dx:-3px;--dy:1px"><img class="avatar" style="width:19px;height:19px" src="${src}" alt=""></span>`;
const A1 = 'https://sleepercdn.com/uploads/960cfe0ec025b2d625fe9a5d9501ddae.jpg';
const tv = (name, src, crop = '') => `<span class="tv-list"><span class="tv-logo ${crop}"><span class="tv-img"><img src="${src}" alt="${name}"></span>${crop ? '' : name}</span></span>`;
const fox = tv('FOX', 'https://cdn.simpleicons.org/fox/f5c542', 'tv-crop-fox');
const cbs = tv('CBS', 'https://cdn.simpleicons.org/cbs/ffffff');
const prime = '<span class="tv-list"><span class="tv tv-prime">prime video</span></span>';
const matchup = '<button class="meta-research">Matchup <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
const ball = '<span class="ball" aria-label="Has the ball">🏈</span>';
const sign = (s) => s.replace(/^([+−])/, '<span class="sign">$1</span>');
const cell = (area, main, sub = '', cls = '', extra = '') => `<button class="cell ${cls}" style="grid-area:${area}"><span class="cell-main">${sign(main)}</span>${sub ? `<span class="cell-sub">${sign(sub)}</span>` : ''}${extra}</button>`;
const heads = '<div class="g-head" style="grid-area:1/3">Money</div><div class="g-head" style="grid-area:1/4">Spread</div><div class="g-head" style="grid-area:1/5">Total</div>';
const bar = (away, c1, c2) => `<div class="win-bar" style="grid-area:2/1/5/2">${away > 0 ? `<span style="flex-basis:${away}%;background:${c1}"></span>` : ''}${away < 100 ? `<span style="flex-basis:${100 - away}%;background:${c2}"></span>` : ''}</div>`;
const dots = (s) => [...s].map((r) => `<i class="${r}"></i>`).join('');
const team = (t, row, record, form) => `<button class="g-team" style="grid-area:${row}/2">${logo(t)}<strong class="g-abbr">${t}</strong><small class="g-record">${record}</small><span class="dots">${dots(form)}</span></button>`;
const scored = (t, row, score, { lost, hasBall, timeouts } = {}) => `
  <button class="g-team scored ${lost ? 'lost' : ''}" style="grid-area:${row}/2">${logo(t)}
    <span class="score-line"><span class="g-score">${score}</span>${hasBall ? ball : ''}</span>
    <small class="g-abbr-s">${t}</small>
    ${timeouts != null ? `<span class="tos" title="${timeouts} timeouts left">${[0, 1, 2].map((i) => `<i class="${i < timeouts ? '' : 'used'}"></i>`).join('')}</span>` : ''}
  </button>`;
const hang = (x) => x.replace(/^([+−])(.*)$/, '<span class="num"><span class="sg">$1</span>$2</span>');
const strip = (items, on, area) => `<div class="dial" style="grid-area:${area}"><div class="strip">${items.map((x, i) => `<div class="strip-item ${i === on ? 'on' : ''}">${hang(x)}</div>`).join('')}</div></div>`;
const SPREAD = ['−7.5', '−6.5', '−5.5', '−4.5', '−3.5', '−2.5', '−1.5', '+1.5', '+2.5', '+3.5', '+4.5', '+5.5'];
const TOTAL = ['40.5', '41.5', '42.5', '43.5', '44.5', '45.5', '46.5', '47.5', '48.5', '49.5', '50.5'];
let chartId = 0;
const momentum = (series, awayColor, homeColor, area) => {
  const id = `m${chartId++}`;
  const pts = series.map((p, i) => `${(i / (series.length - 1)) * 100},${24 - (p / 100) * 24}`).join(' ');
  return `<svg class="momentum" style="grid-area:${area}" viewBox="0 0 100 24" preserveAspectRatio="none" aria-label="Win chance through the game">
    <defs><clipPath id="${id}a"><rect x="0" y="0" width="100" height="12"/></clipPath><clipPath id="${id}h"><rect x="0" y="12" width="100" height="12"/></clipPath></defs>
    <line x1="0" y1="12" x2="100" y2="12" stroke="#2d3963" stroke-width="1" vector-effect="non-scaling-stroke"/>
    <polygon points="0,12 ${pts} 100,12" fill="${awayColor}" fill-opacity="0.5" clip-path="url(#${id}a)"/>
    <polygon points="0,12 ${pts} 100,12" fill="${homeColor}" fill-opacity="0.5" clip-path="url(#${id}h)"/>
    <polyline points="${pts}" fill="none" stroke="${awayColor}" stroke-width="1.5" vector-effect="non-scaling-stroke" clip-path="url(#${id}a)"/>
    <polyline points="${pts}" fill="none" stroke="${homeColor}" stroke-width="1.5" vector-effect="non-scaling-stroke" clip-path="url(#${id}h)"/>
  </svg>`;
};
const card = (cls, meta, grid) => `<article class="game ${cls}"><div class="g-meta">${meta}</div><div class="g-grid">${heads}${grid}</div></article>`;

const upcoming = (time, a, b, pct, colors) => card('', `<span class="meta-time">${time}</span>${fox}<span>⛅ 61°</span>${matchup}`,
  bar(pct, ...colors) + team(a, 2, '3-4', 'wlwll') + team(b, 4, '2-5', 'llwlw')
  + cell('2/3', `${pct}%`, '', 'cell-ml') + cell('4/3', `${100 - pct + 1}%`, '', 'cell-ml')
  + cell('2/4', '+2.5', '50%') + cell('4/4', '−2.5', '51%') + strip(SPREAD, 8, '3/4')
  + cell('2/5', 'O 43.5', '51%') + cell('4/5', 'U 43.5', '50%') + strip(TOTAL, 3, '3/5'));

// Live: the clock where the kickoff time was; the ball and timeouts by each score; the
// down and the spot between the teams (arrow toward the team with the ball).
const live = (away, home, as, hs, { clock, tvb, ballTop, drive, last, redzone, tos, pct, colors, picks = '' }) => card('live', `<span class="live-clock">${clock}</span>${tvb}${matchup}`,
  bar(pct, ...colors) + scored(away, 2, as, { timeouts: tos[0] }) + scored(home, 4, hs, { timeouts: tos[1] })
  + `<div class="drive ${redzone ? 'redzone' : ''}" style="grid-area:3/2/4/6"><span class="arrow">${ballTop ? '▲' : '▼'}</span>${drive}</div>`
  + cell('2/3', `${pct}%`, '', 'frozen cell-ml') + cell('4/3', `${100 - pct}%`, '', 'frozen cell-ml', picks)
  + cell('2/4', '−1.5', '52%', 'frozen') + cell('4/4', '+1.5', '49%', 'frozen')
  + cell('2/5', 'O 44.5', '58%', 'frozen') + cell('4/5', 'U 44.5', '43%', 'frozen'));

// Final, with kickoff prices: what each line was at kickoff and what won.
const final = card('final', `<span class="meta-time">Thu 8:15 PM</span>${prime}${matchup}`,
  bar(0, '#0085CA', '#203731') + scored('CAR', 2, 19, { lost: true }) + scored('GB', 4, 27)
  + momentum([37, 50, 42, 46, 41, 40, 33, 34, 38, 47, 49, 45, 55, 49, 42, 37, 35, 36, 23, 22, 19, 17, 13, 14, 15, 16, 16, 16, 15, 9, 6, 7, 5, 6, 4, 3, 3, 5, 6, 3, 5, 5, 6, 9, 6, 13, 14, 2, 1], '#0085CA', '#4b9b5f', '3/3')
  + '<div class="settle" style="grid-area:3/4">GB −8</div>'
  + '<div class="settle" style="grid-area:3/5">46</div>'
  + cell('2/3', '37%', '', 'frozen cell-ml lost') + cell('4/3', '65%', '', 'frozen cell-ml won', face(A1, -12))
  + cell('2/4', '+3.5', '49%', 'frozen lost') + cell('4/4', '−3.5', '52%', 'frozen won')
  + cell('2/5', 'O 44.5', '50%', 'frozen won') + cell('4/5', 'U 44.5', '51%', 'frozen lost'));

document.getElementById('mock').innerHTML = `
  <h1 class="mock-h">The board, once games start</h1>
  <p class="mock-sub">Upcoming, then live, then final. Strips have dial ticks.</p>
  <h2 class="day-title">Sunday, Nov 1</h2>
  ${upcoming('1:00 PM', 'ATL', 'TB', 45, ['#A71930', '#D50A0A'])}
  ${upcoming('4:25 PM', 'LV', 'NYJ', 47, ['#A5ACAF', '#125740'])}
  <h2 class="day-title">Monday, Nov 2</h2>
  ${upcoming('8:15 PM', 'CHI', 'SEA', 40, ['#0B162A', '#69BE28'])}

  <div class="band live"><span>LIVE</span><small>2 games</small></div>
  <h2 class="day-title">Sunday, Nov 1</h2>
  ${live('KC', 'DEN', 17, 13, { clock: 'Q3 8:42', tvb: cbs, ballTop: true, drive: '2nd &amp; 7 · DEN 34', last: 'P.Mahomes pass short right to T.Kelce to DEN 34 for 9 yards (P.Surtain).', tos: [2, 3], pct: 61, colors: ['#E31837', '#FB4F14'], picks: face(A1, 8) })}
  ${live('NE', 'MIA', 10, 14, { clock: 'Q2 1:58', tvb: fox, ballTop: false, drive: '1st &amp; Goal · NE 6', last: 'D.Achane up the middle to NE 6 for 12 yards (C.Gonzalez).', redzone: true, tos: [1, 2], pct: 34, colors: ['#002244', '#008E97'] })}

  <div class="band"><span>FINAL</span><small>1 game</small></div>
  <h2 class="day-title">Thursday, Oct 29</h2>
  ${final}

`;

for (const strip of document.querySelectorAll('.strip')) {
  const items = [...strip.children];
  const on = items.findIndex((x) => x.classList.contains('on'));
  requestAnimationFrame(() => (strip.scrollLeft = on * 36));
  strip.addEventListener('scroll', () => {
    const i = Math.round(strip.scrollLeft / 36);
    items.forEach((x, j) => x.classList.toggle('on', j === i));
  });
  strip.addEventListener('click', (e) => {
    const item = e.target.closest('.strip-item');
    if (item) strip.scrollTo({ left: items.indexOf(item) * 36, behavior: 'smooth' });
  });
}
</script>
</body>
</html>
