<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mockups · Started games</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding-bottom: 60px; }
  .mock { max-width: 560px; margin: 0 auto; padding: 0 10px; }
  .mock-h { margin: 34px 4px 4px; font-size: 13px; font-weight: 800; color: var(--text); }
  .mock-sub { margin: 0 4px 12px; font-size: 12px; color: var(--muted); }
  .opt { margin: 4px 4px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent); }

  /* ---- Started cards: same card, same grid ---- */
  .game.live { border-color: rgba(255, 107, 125, 0.4); }
  .game.final { background: #10162b; }
  .live-clock { color: #ff8f9b; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
  .live-clock::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #ff5a6e; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .final-tag { color: var(--text); font-weight: 700; }
  .poss { color: #b9c2dd; }

  /* Scored team row: like the upcoming card (abbr small under the logo, where the record
     sits), with the score big beside it and a ball under it while they have it. */
  .g-team.scored { grid-template-columns: 26px 1fr; }
  .g-team.scored .g-abbr { grid-column: 1; grid-row: 2; justify-self: center; font-size: 9.5px; font-weight: 700; color: var(--muted); }
  .g-team.scored .g-score { grid-column: 2; grid-row: 1; font-size: 21px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--text); }
  .g-team.scored .ball { grid-column: 2; grid-row: 2; font-size: 9px; line-height: 1; }
  .g-team.lost { opacity: 0.45; }

  .cell.frozen { cursor: default; }
  .cell.frozen:active { transform: none; }
  .cell.won { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cell.won::after {
    content: '✓'; position: absolute; top: -6px; right: -5px; width: 16px; height: 16px; border-radius: 50%;
    display: grid; place-items: center; font-size: 10px; font-weight: 900; color: var(--accent-ink); background: var(--accent);
  }
  .cell.lost { opacity: 0.38; }
  .cell.push { border-style: dashed; }
  .line-fixed { display: grid; place-items: center; height: 24px; font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .line-fixed small { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; color: var(--faint); margin-left: 4px; }
  .kick-note { margin: 6px 4px 0; font-size: 10.5px; color: var(--faint); }

  /* ---- Dividers ---- */
  .div-a { position: relative; margin: 30px -10px 14px; height: 22px; display: grid; place-items: center; }
  .div-a::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 2px dashed #2d3963; }
  .div-a span { position: relative; padding: 3px 10px; border-radius: 99px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.1em; background: var(--bg, #0b1020); border: 1px solid #2d3963; color: var(--text); }
  .div-a.live span { color: #ff8f9b; border-color: rgba(255, 107, 125, 0.45); }

  .div-b { margin: 30px -10px 12px; padding: 9px 14px; background: #141b33; border-top: 1px solid #2d3963; border-bottom: 1px solid #2d3963;
    display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--text); }
  .div-b small { font-weight: 600; letter-spacing: 0.04em; color: var(--muted); }
  .div-b.live { color: #ff8f9b; }

  .div-c { margin: 26px -10px 10px; }
  .div-c svg { display: block; width: 100%; height: 10px; }
  .div-c span { display: block; margin: 8px 14px 0; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--text); }
  .div-c.live span { color: #ff8f9b; }

  /* ---- Strip hints ---- */
  .hint-a { position: relative; }
  .hint-a .arrow { position: absolute; top: 1px; height: 22px; width: 16px; display: grid; place-items: center; border-radius: 6px; background: #18203d; color: var(--text); font-size: 15px; font-weight: 800; line-height: 1; z-index: 1; cursor: pointer; }
  .hint-a .arrow.l { left: -2px; } .hint-a .arrow.r { right: -2px; }

  .hint-b .strip { height: 30px; background:
      repeating-linear-gradient(90deg, transparent 0 17px, #56638f 17px 18.5px, transparent 18.5px 36px) 0 100% / 100% 6px no-repeat; background-attachment: local; }
  .hint-b .strip-item { align-self: start; height: 24px; }
  .hint-b .tick { position: absolute; left: 50%; bottom: 0; width: 2px; height: 8px; margin-left: -1px; border-radius: 1px; background: var(--accent); }

  .hint-c.strip-wrap { position: relative; }
  .hint-c.strip-wrap::before { content: ''; position: absolute; left: 50%; top: 1px; width: 40px; height: 22px; margin-left: -20px; border-radius: 99px; border: 1px solid #4a5786; background: #18203d; pointer-events: none; }
  .hint-c .strip { position: relative; }

  @keyframes peek { 0%, 100% { transform: none; } 30% { transform: translateX(-22px); } 60% { transform: translateX(8px); } }
  .hint-d.go .strip-item { animation: peek 1.1s cubic-bezier(0.3, 0.7, 0.4, 1) 1; }
  .replay { margin: 6px 4px 0; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--muted); font: inherit; font-size: 11px; }
  .strip-slot { position: relative; }
</style>
</head>
<body>
<main class="mock" id="mock"></main>
<script type="module">
const logo = (t, s = 24) => `<img class="logo" style="width:${s}px;height:${s}px" src="https://sleepercdn.com/images/team_logos/nfl/${t.toLowerCase()}.png" alt="${t}">`;
const face = (src, rot = -9) => `<span class="sticker" style="--rot:${rot}deg;--dx:-3px;--dy:1px"><img class="avatar" style="width:19px;height:19px" src="${src}" alt=""></span>`;
const A1 = 'https://sleepercdn.com/uploads/960cfe0ec025b2d625fe9a5d9501ddae.jpg';
const fox = '<span class="tv-list"><span class="tv-logo tv-crop-fox"><span class="tv-img"><img src="https://cdn.simpleicons.org/fox/f5c542" alt="FOX"></span></span></span>';
const cbs = '<span class="tv-list"><span class="tv-logo"><span class="tv-img"><img src="https://cdn.simpleicons.org/cbs/ffffff" alt="CBS"></span>CBS</span></span>';
const matchup = '<button class="meta-research">Matchup <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
const sign = (s) => s.replace(/^([+−])/, '<span class="sign">$1</span>');
const cell = (area, main, sub = '', cls = '', extra = '') => `<button class="cell ${cls}" style="grid-area:${area}"><span class="cell-main">${sign(main)}</span>${sub ? `<span class="cell-sub">${sign(sub)}</span>` : ''}${extra}</button>`;
const heads = '<div class="g-head" style="grid-area:1/3">Money</div><div class="g-head" style="grid-area:1/4">Spread</div><div class="g-head" style="grid-area:1/5">Total</div>';
const bar = (away, c1, c2) => `<div class="win-bar" style="grid-area:2/1/5/2"><span style="flex-basis:${away}%;background:${c1}"></span><span style="flex-basis:${100 - away}%;background:${c2}"></span></div>`;
const team = (t, row, { record, dots, score, lost, ball } = {}) => score != null ? `
  <button class="g-team scored ${lost ? 'lost' : ''}" style="grid-area:${row}/2">${logo(t)}
    <span class="g-score">${score}</span><strong class="g-abbr">${t}</strong>${ball ? '<span class="ball">🏈</span>' : ''}
  </button>` : `
  <button class="g-team" style="grid-area:${row}/2">${logo(t)}
    <strong class="g-abbr">${t}</strong><small class="g-record">${record}</small><span class="dots">${dots}</span>
  </button>`;
const dots = (s) => [...s].map((r) => `<i class="${r}"></i>`).join('');
const stripHtml = (items, on, area, cls = '') => `<div class="strip ${cls}" style="grid-area:${area}">${items.map((x, i) => `<div class="strip-item ${i === on ? 'on' : ''}">${x}</div>`).join('')}</div>`;
const SPREAD = ['−7.5', '−6.5', '−5.5', '−4.5', '−3.5', '−2.5', '−1.5', '+1.5', '+2.5', '+3.5', '+4.5', '+5.5'];
const TOTAL = ['40.5', '41.5', '42.5', '43.5', '44.5', '45.5', '46.5', '47.5', '48.5', '49.5', '50.5'];
const card = (cls, meta, grid, after = '') => `<article class="game ${cls}"><div class="g-meta">${meta}</div><div class="g-grid">${heads}${grid}</div>${after}</article>`;

// An upcoming game, as on the board today.
const upcoming = (stripWrap = (s) => s) => card('', `<span class="meta-time">12:00 PM</span>${fox}<span>⛅ 61°</span>${matchup}`,
  bar(45, '#A71930', '#D50A0A') + team('ATL', 2, { record: '3-4', dots: dots('wlwll') }) + team('TB', 4, { record: '2-5', dots: dots('llwlw') })
  + cell('2/3', '45%') + cell('4/3', '56%')
  + cell('2/4', '+2.5', '50%') + cell('4/4', '−2.5', '51%') + stripWrap(stripHtml(SPREAD, 8, '3/4'), '3/4')
  + cell('2/5', 'O 43.5', '51%') + cell('4/5', 'U 43.5', '50%') + stripWrap(stripHtml(TOTAL, 3, '3/5'), '3/5'));

// Live: same card. Scores where the record was, the clock and who has the ball up top,
// and the market's live chances (not tappable). The line under each column is the main line.
const live = card('live', `<span class="live-clock">Q3 8:42</span>${cbs}<span class="poss">KC ball · 2nd &amp; 7</span>${matchup}`,
  bar(61, '#E31837', '#FB4F14') + team('KC', 2, { score: 17, ball: true }) + team('DEN', 4, { score: 13 })
  + cell('2/3', '61%', '', 'frozen') + cell('4/3', '40%', '', 'frozen', face(A1, 8))
  + cell('2/4', '−1.5', '52%', 'frozen') + cell('4/4', '+1.5', '49%', 'frozen')
  + '<div class="line-fixed" style="grid-area:3/4">−1.5</div>'
  + cell('2/5', 'O 44.5', '58%', 'frozen') + cell('4/5', 'U 44.5', '43%', 'frozen')
  + '<div class="line-fixed" style="grid-area:3/5">44.5</div>');

// Final, with kickoff prices from the history endpoint: what each line was at kickoff,
// what won (✓), and the stickers of who had what.
const final = card('final', `<span class="final-tag">Final</span><span class="meta-time">Thu 8:15 PM</span>${fox}<span>Kickoff lines</span>${matchup}`,
  bar(38, '#0085CA', '#203731') + team('CAR', 2, { score: 20, lost: true }) + team('GB', 4, { score: 27 })
  + cell('2/3', '38%', '', 'frozen lost') + cell('4/3', '63%', '', 'frozen won', face(A1, -12))
  + cell('2/4', '+3.5', '49%', 'frozen lost') + cell('4/4', '−3.5', '52%', 'frozen won')
  + '<div class="line-fixed" style="grid-area:3/4">−3.5</div>'
  + cell('2/5', 'O 45.5', '50%', 'frozen won') + cell('4/5', 'U 45.5', '51%', 'frozen lost')
  + '<div class="line-fixed" style="grid-area:3/5">45.5</div>');

// Final, when kickoff prices can't be found: just what happened.
const finalPlain = card('final', `<span class="final-tag">Final</span><span class="meta-time">Thu 8:15 PM</span>${fox}${matchup}`,
  team('CAR', 2, { score: 20, lost: true }) + team('GB', 4, { score: 27 })
  + cell('2/3', 'L', '', 'frozen lost') + cell('4/3', 'W', '', 'frozen won')
  + cell('2/4', '−7', '', 'frozen lost') + cell('4/4', '+7', '', 'frozen won')
  + '<div class="line-fixed" style="grid-area:3/4">margin</div>'
  + cell('2/5', '47', '', 'frozen') + cell('4/5', 'pts', '', 'frozen lost')
  + '<div class="line-fixed" style="grid-area:3/5">total</div>');

const divA = (label, cls = '') => `<div class="div-a ${cls}"><span>${label}</span></div>`;
const divB = (label, n, cls = '') => `<div class="div-b ${cls}"><span>${label}</span><small>${n}</small></div>`;
const zig = '<svg viewBox="0 0 400 10" preserveAspectRatio="none"><path d="M0 5 Q 5 0 10 5 T 20 5 T 30 5 T 40 5 T 50 5 T 60 5 T 70 5 T 80 5 T 90 5 T 100 5 T 110 5 T 120 5 T 130 5 T 140 5 T 150 5 T 160 5 T 170 5 T 180 5 T 190 5 T 200 5 T 210 5 T 220 5 T 230 5 T 240 5 T 250 5 T 260 5 T 270 5 T 280 5 T 290 5 T 300 5 T 310 5 T 320 5 T 330 5 T 340 5 T 350 5 T 360 5 T 370 5 T 380 5 T 390 5 T 400 5" fill="none" stroke="#3a466e" stroke-width="1.6"/></svg>';
const divC = (label, cls = '') => `<div class="div-c ${cls}">${zig}<span>${label}</span></div>`;

// Strip hint options, each on a real card.
const arrows = (s) => `<div class="hint-a strip-slot" style="grid-area:${s.match(/grid-area:([^"]+)/)[1]}"><span class="arrow l">‹</span>${s.replace(/style="grid-area:[^"]+"/, '')}<span class="arrow r">›</span></div>`;
const ruler = (s) => `<div class="hint-b strip-slot" style="grid-area:${s.match(/grid-area:([^"]+)/)[1]}">${s.replace(/style="grid-area:[^"]+"/, '')}<i class="tick"></i></div>`;
const capsule = (s) => `<div class="hint-c strip-wrap" style="grid-area:${s.match(/grid-area:([^"]+)/)[1]}">${s.replace(/style="grid-area:[^"]+"/, '')}</div>`;
const peek = (s) => `<div class="hint-d strip-slot" style="grid-area:${s.match(/grid-area:([^"]+)/)[1]}">${s.replace(/style="grid-area:[^"]+"/, '')}</div>`;

document.getElementById('mock').innerHTML = `
  <h1 class="mock-h">1 · The board, once games start</h1>
  <p class="mock-sub">Upcoming first, then a hard break for live games, then finished ones. Same card size.</p>
  <h2 class="day-title">Sunday, Nov 1</h2>
  ${upcoming()}
  ${divA('● LIVE', 'live')}
  ${live}
  ${divA('FINAL')}
  ${final}
  <p class="opt">IF KICKOFF PRICES CAN’T BE FOUND</p>
  ${finalPlain}

  <h1 class="mock-h">2 · The break between sections</h1>
  <p class="opt">A · DASHED LINE + PILL</p>${divA('● LIVE', 'live')}${divA('FINAL')}
  <p class="opt">B · FULL-WIDTH BAND</p>${divB('● LIVE', '2 games', 'live')}${divB('FINAL', '3 games')}
  <p class="opt">C · SQUIGGLE</p>${divC('● LIVE', 'live')}${divC('FINAL')}

  <h1 class="mock-h">3 · Showing the line strip moves</h1>
  <p class="mock-sub">All of these also step one line when you tap a number beside the current one.</p>
  <p class="opt">A · ARROWS AT THE ENDS</p>${upcoming(arrows)}
  <p class="opt">B · DIAL TICKS UNDERNEATH</p>${upcoming(ruler)}
  <p class="opt">C · SELECTED LINE IN A CAPSULE</p>${upcoming(capsule)}
  <p class="opt">D · ONE NUDGE THE FIRST TIME YOU SEE IT</p><div id="peek">${upcoming(peek)}</div><button class="replay" id="replay">Replay nudge</button>
`;

// Make the mock strips move like the real ones, and tap-to-step.
for (const strip of document.querySelectorAll('.strip')) {
  const items = [...strip.children];
  const on = items.findIndex((x) => x.classList.contains('on'));
  requestAnimationFrame(() => (strip.scrollLeft = on * 36));
  strip.addEventListener('scroll', () => {
    const i = Math.round(strip.scrollLeft / 36);
    items.forEach((x, j) => x.classList.toggle('on', j === i));
  });
  strip.addEventListener('click', (e) => {
    const item = e.target.closest('.strip-item');
    if (item) strip.scrollTo({ left: items.indexOf(item) * 36, behavior: 'smooth' });
  });
}
for (const a of document.querySelectorAll('.hint-a .arrow')) {
  a.addEventListener('click', () => { const s = a.parentElement.querySelector('.strip'); s.scrollBy({ left: a.classList.contains('l') ? -36 : 36, behavior: 'smooth' }); });
}
const nudge = () => { for (const d of document.querySelectorAll('#peek .hint-d')) { d.classList.remove('go'); void d.offsetWidth; d.classList.add('go'); } };
setTimeout(nudge, 600);
document.getElementById('replay').onclick = nudge;
</script>
</body>
</html>
