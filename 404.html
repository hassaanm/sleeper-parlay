<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parlay Pool</title>
  <meta name="description" content="Weekly group parlay for your Sleeper league: one leg each, live NFL lines.">
  <meta name="theme-color" content="#0d1220">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Paths below are relative, so "/<leagueId>/" (trailing slash) would break them. -->
  <script>if (/\/\d{6,}\/$/.test(location.pathname)) location.replace(location.pathname.slice(0, -1) + location.search + location.hash);</script>
  <link rel="stylesheet" href="styles.css">
  <!-- Fetch every module up front instead of one import level at a time. Optional:
       a module missing here still loads, just later. -->
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/rules.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/lines.js">
  <link rel="modulepreload" href="js/sports.js">
  <link rel="modulepreload" href="js/research.js">
  <link rel="modulepreload" href="js/teams.js">
  <link rel="modulepreload" href="js/views/board.js">
  <link rel="modulepreload" href="js/views/slip.js">
  <link rel="modulepreload" href="js/views/admin.js">
  <link rel="modulepreload" href="js/views/pages.js">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
